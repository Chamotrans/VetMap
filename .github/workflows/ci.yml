name: Backend and Config Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: "Firebase rules and functions"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firebase-tests/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix firebase-tests

      - name: Validate Hong Kong clinic catalog integrity
        run: |
          node --test scripts/validate_hk_catalog_integrity.test.mjs
          node scripts/validate_hk_catalog_integrity.mjs

      - name: Validate pending Hong Kong clinic hours v2 plan
        run: |
          node --test scripts/validate_hk_clinic_hours_v2_pending.test.mjs
          node scripts/validate_hk_clinic_hours_v2_pending.mjs

      - name: Test pending clinic hours v2 restore runner
        run: node --test scripts/restore_hk_clinic_hours_v2_pending.test.mjs

      - name: Test clinic availability audit states
        run: node --test scripts/hk_clinic_availability_audit.test.mjs

      - name: Validate iOS privacy and chat reliability source gates
        run: node --test scripts/validate_ios_privacy_reliability.test.mjs

      - name: Validate account-synchronised catalog favourites
        run: node --test scripts/validate_catalog_favorites.test.mjs

      - name: Validate account recovery and authenticated community actions
        run: |
          node --test scripts/validate_password_reset.test.mjs
          node --test scripts/validate_authenticated_community_actions.test.mjs
          node --test scripts/validate_support_contact.test.mjs

      - name: Validate iOS first-run, discovery, chat, and refresh resilience
        run: |
          node --test scripts/validate_onboarding_localization.test.mjs
          node --test scripts/validate_map_carousel_selection.test.mjs
          node --test scripts/validate_urgent_clinic_mode.test.mjs
          node --test scripts/validate_latest_clinic_load.test.mjs
          node --test scripts/validate_chat_draft_safety.test.mjs
          node --test scripts/validate_community_refresh_resilience.test.mjs

      - name: Validate App Review notes
        run: node --test scripts/validate_app_review_notes.test.mjs

      - name: Validate Functions
        run: |
          npm run lint --prefix functions
          node -e "require('./functions/index.js')"

      - name: Test Firestore and Storage rules
        run: >
          npx --yes firebase-tools@15.19.0 emulators:exec
          --project demo-vetmap-rules
          --only firestore,storage
          "npm test --prefix functions && npm test --prefix firebase-tests"

      - name: Check patch hygiene
        run: git diff --check

# The signed iOS Test/Archive release proof is produced by Xcode Cloud.
